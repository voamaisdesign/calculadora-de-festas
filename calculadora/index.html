<!-- ESTE ARQUIVO E A CALCULADORA (SIMULADOR DO ESPACO) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora — Simulador de Festas</title>
  <style>
    :root {
      --bg: #e8ecf2;
      --surface: #ffffff;
      --surface-dark: #0f172a;
      --text: #0f172a;
      --text-secondary: #334155;
      --border: #94a3b8;
      --border-light: #cbd5e1;
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --cta: #d97706;
      --cta-hover: #b45309;
      --badge-bg: #dbeafe;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px 44px;
    }

    header {
      background: var(--surface-dark);
      color: #ffffff;
      border-bottom: 2px solid #1e293b;
      margin-bottom: 28px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      gap: 16px;
    }

    .brand {
      font-weight: 900;
      font-size: 0.95rem;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-link {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }

    .nav-link:hover { color: #fbbf24; }

    .top-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .top-card h1 {
      font-size: clamp(1.45rem, 2.8vw, 2rem);
      color: var(--primary);
      margin-bottom: 6px;
    }

    .top-card p {
      color: var(--text-secondary);
      font-size: 0.96rem;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .inline-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field select,
    .field input[type="number"],
    .field input[type="tel"],
    .field input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      background: #ffffff;
    }

    .field input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .range-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .checks { display: grid; gap: 10px; }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid var(--border-light);
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .check-left input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }

    .price-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    .price-wrap input[type="number"] {
      width: 90px;
      padding: 6px 8px;
      text-align: right;
    }

    .summary {
      background: var(--surface-dark);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .summary-label { font-size: 0.86rem; color: #cbd5e1; }

    .total {
      font-size: 2rem;
      font-weight: 800;
      color: #fbbf24;
      margin: 4px 0 14px;
    }

    .wa-box {
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.88rem;
      white-space: pre-line;
      margin-bottom: 16px;
      border: 2px solid #94a3b8;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.96rem;
      text-decoration: none;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .btn-cta { background: var(--cta); color: #ffffff; }
    .btn-cta:hover { background: var(--cta-hover); }

    @media (max-width: 820px) {
      .calc-grid, .inline-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="./" class="brand">CALCULADORA • SIMULADOR</a>
      <a href="../" class="nav-link">← Voltar para a Landing Page</a>
    </div>
  </header>

  <main class="container">
    <div class="top-card">
      <h1>Simulador de Orçamento de Festa</h1>
      <p>Teste a simulação ajustando os valores do espaço, a quantidade de convidados e os adicionais.</p>
    </div>

    <div class="calc-grid">
      <section class="panel">
        <div class="inline-2">
          <div class="field">
            <label for="spaceName">Nome do espaço</label>
            <input type="text" id="spaceName" value="Espaço da Festa" />
          </div>

          <div class="field">
            <label for="whatsappNum">WhatsApp do espaço (com DDD)</label>
            <input type="tel" id="whatsappNum" placeholder="Ex.: 51999998888" />
          </div>
        </div>

        <div class="inline-2">
          <div class="field">
            <label for="eventType">Tipo de festa</label>
            <select id="eventType">
              <option value="Aniversário Adulto">Aniversário Adulto</option>
              <option value="Festa Infantil">Festa Infantil</option>
              <option value="Casamento" selected>Casamento</option>
              <option value="Debutante / 15 Anos">Debutante / 15 Anos</option>
              <option value="Formatura">Formatura</option>
              <option value="Confraternização / Corporativo">Confraternização / Corporativo</option>
              <option value="Chá de Bebê / Panela">Chá de Bebê / Panela</option>
              <option value="Outro Evento">Outro Evento</option>
            </select>
          </div>

          <div class="field">
            <label for="dayType">Período do evento</label>
            <select id="dayType">
              <option value="weekday">Segunda a Quinta</option>
              <option value="weekend" selected>Sexta a Domingo / Feriado</option>
            </select>
          </div>
        </div>

        <div class="inline-2">
          <div class="field">
            <label for="weekdayBase">Valor base Seg a Qui (R$)</label>
            <input type="number" id="weekdayBase" min="0" step="50" value="2200" />
          </div>

          <div class="field">
            <label for="weekendBase">Valor base Sex a Dom (R$)</label>
            <input type="number" id="weekendBase" min="0" step="50" value="3400" />
          </div>
        </div>

        <div class="inline-2">
          <div class="field">
            <label for="maxGuests">Capacidade máxima</label>
            <input type="number" id="maxGuests" min="10" max="2000" step="5" value="150" />
          </div>

          <div class="field">
            <label for="extraGuestVal">Convidado extra acima de 50 (R$)</label>
            <input type="number" id="extraGuestVal" min="0" step="5" value="45" />
          </div>
        </div>

        <div class="field">
          <label for="guestsSlider">Convidados na simulação</label>
          <input type="range" id="guestsSlider" min="10" max="150" step="5" value="80" />
          <div class="range-meta">
            <span>10</span>
            <strong id="guestsLabel">80 convidados</strong>
            <span id="maxLabel">Máx: 150</span>
          </div>
        </div>

        <div class="field">
          <label>Adicionais opcionais</label>
          <div class="checks">
            <div class="check-item">
              <label class="check-left">
                <input type="checkbox" class="addon-check" data-input="addon1" data-name="Som e Iluminação" checked />
                Som e Iluminação
              </label>
              <span class="price-wrap">+ R$ <input type="number" id="addon1" min="0" step="50" value="650" /></span>
            </div>

            <div class="check-item">
              <label class="check-left">
                <input type="checkbox" class="addon-check" data-input="addon2" data-name="Churrasqueira / Equipe" />
                Churrasqueira / Equipe
              </label>
              <span class="price-wrap">+ R$ <input type="number" id="addon2" min="0" step="50" value="900" /></span>
            </div>

            <div class="check-item">
              <label class="check-left">
                <input type="checkbox" class="addon-check" data-input="addon3" data-name="Decoração Básica" />
                Decoração Básica
              </label>
              <span class="price-wrap">+ R$ <input type="number" id="addon3" min="0" step="50" value="500" /></span>
            </div>
          </div>
        </div>
      </section>

      <aside class="summary">
        <span class="summary-label">Estimativa inicial</span>
        <div class="total" id="totalValue">R$ 5.400</div>
        <div class="wa-box" id="waText"></div>
        <a href="#" id="sendWhatsAppBtn" target="_blank" rel="noopener" class="btn btn-cta">
          Enviar orçamento no WhatsApp
        </a>
      </aside>
    </div>
  </main>

  <script>
    const spaceNameEl = document.getElementById("spaceName");
    const whatsappNumEl = document.getElementById("whatsappNum");
    const eventTypeEl = document.getElementById("eventType");
    const dayTypeEl = document.getElementById("dayType");
    const weekdayBaseEl = document.getElementById("weekdayBase");
    const weekendBaseEl = document.getElementById("weekendBase");
    const maxGuestsEl = document.getElementById("maxGuests");
    const extraGuestValEl = document.getElementById("extraGuestVal");
    const guestsSliderEl = document.getElementById("guestsSlider");
    const guestsLabelEl = document.getElementById("guestsLabel");
    const maxLabelEl = document.getElementById("maxLabel");
    const addonChecks = document.querySelectorAll(".addon-check");
    const totalValueEl = document.getElementById("totalValue");
    const waTextEl = document.getElementById("waText");
    const sendWhatsAppBtn = document.getElementById("sendWhatsAppBtn");

    function formatBRL(val) {
      return val.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
        maximumFractionDigits: 0
      });
    }

    function syncMax() {
      const maxVal = Math.max(10, Number(maxGuestsEl.value) || 150);
      guestsSliderEl.max = maxVal;
      maxLabelEl.textContent = `Máx: ${maxVal}`;
      if (Number(guestsSliderEl.value) > maxVal) {
        guestsSliderEl.value = maxVal;
      }
      recalculate();
    }

    function recalculate() {
      const spaceName = spaceNameEl.value.trim() || "Espaço da Festa";
      const eventType = eventTypeEl.value;
      const dayLabel = dayTypeEl.options[dayTypeEl.selectedIndex].text;
      const base = dayTypeEl.value === "weekday"
        ? Math.max(0, Number(weekdayBaseEl.value) || 0)
        : Math.max(0, Number(weekendBaseEl.value) || 0);

      const guests = Number(guestsSliderEl.value);
      guestsLabelEl.textContent = `${guests} convidados`;

      const extraGuests = Math.max(0, guests - 50);
      const extraCost = extraGuests * Math.max(0, Number(extraGuestValEl.value) || 0);

      let addonsCost = 0;
      const chosenAddons = [];
      addonChecks.forEach((chk) => {
        if (chk.checked) {
          const val = Math.max(0, Number(document.getElementById(chk.dataset.input).value) || 0);
          addonsCost += val;
          chosenAddons.push(chk.dataset.name);
        }
      });

      const total = base + extraCost + addonsCost;
      totalValueEl.textContent = formatBRL(total);

      const message =
        `Olá! Simulei um orçamento para ${spaceName}:\n` +
        `• Tipo de festa: ${eventType}\n` +
        `• Período: ${dayLabel}\n` +
        `• Convidados: ${guests}\n` +
        `• Adicionais: ${chosenAddons.length ? chosenAddons.join(", ") : "Nenhum"}\n` +
        `• Estimativa inicial: ${formatBRL(total)}`;

      waTextEl.textContent = message;

      const cleanPhone = whatsappNumEl.value.replace(/\D/g, "");
      const waBase = cleanPhone ? `https://wa.me/55${cleanPhone}` : "https://wa.me/";
      sendWhatsAppBtn.href = `${waBase}?text=${encodeURIComponent(message)}`;
    }

    [
      spaceNameEl, whatsappNumEl, eventTypeEl, dayTypeEl,
      weekdayBaseEl, weekendBaseEl, extraGuestValEl, guestsSliderEl,
      document.getElementById("addon1"),
      document.getElementById("addon2"),
      document.getElementById("addon3")
    ].forEach((el) => el.addEventListener("input", recalculate));

    maxGuestsEl.addEventListener("input", syncMax);
    addonChecks.forEach((chk) => chk.addEventListener("change", recalculate));

    syncMax();
  </script>
</body>
</html>
