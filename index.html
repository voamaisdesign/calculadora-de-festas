<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Festas — Simulador de Orçamento</title>
  <style>
    :root {
      --bg: #e8ecf2;
      --surface: #ffffff;
      --surface-dark: #0f172a;
      --text: #0f172a;
      --text-secondary: #334155;
      --border: #94a3b8;
      --border-light: #cbd5e1;
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --accent: #ffff00;
      --accent-hover: #e6e600;
      --badge-bg: #dbeafe;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 24px 16px 48px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      background: var(--surface-dark);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.86rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      border: 2px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-accent {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--badge-bg);
    }

    .panel {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .sim-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .inline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field select,
    .field input[type="text"],
    .field input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .field input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .range-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .checks {
      display: grid;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid var(--border-light);
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .check-left input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }

    .addon-price-tag {
      font-weight: 800;
      color: var(--primary);
      font-size: 0.9rem;
    }

    .summary-box {
      background: var(--surface-dark);
      color: #ffffff;
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .total-value {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--accent);
      margin-top: 2px;
    }

    .wa-box {
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.87rem;
      white-space: pre-line;
      font-weight: 500;
    }

    .config-drawer {
      display: none;
      margin-bottom: 20px;
      border-top: 5px solid var(--primary);
    }

    .config-drawer.open {
      display: block;
    }

    .link-output {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--primary);
      background: #f8fafc;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 8px;
    }

    .status-msg {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 8px;
      min-height: 20px;
    }

    footer {
      margin-top: 28px;
      padding: 14px 16px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: underline;
    }

    @media (max-width: 820px) {
      .sim-grid,
      .inline-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <div class="brand-title" id="spaceTitleDisplay">Calculadora de Festas</div>
        <div class="brand-sub" id="spaceSubtitleDisplay">Simule seu evento e envie o orçamento direto no WhatsApp</div>
      </div>
      <button type="button" class="btn btn-outline" id="toggleConfigBtn">Configurar meu espaço</button>
    </header>

    <!-- Painel do dono do espaço para gerar seu próprio link sem edição manual -->
    <section class="panel config-drawer" id="configDrawer">
      <h2 style="font-size: 1.2rem; margin-bottom: 6px;">Configurar dados do espaço e gerar link próprio</h2>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 18px;">
        Preencha os valores do seu espaço e clique em <strong>Gerar meu link pronto</strong>. Você não precisa mexer em código.
      </p>

      <div class="inline-grid">
        <div class="field">
          <label for="cfgSpaceName">Nome do espaço / buffet</label>
          <input type="text" id="cfgSpaceName" value="Espaço Celebrar" />
        </div>
        <div class="field">
          <label for="cfgWhatsapp">WhatsApp com DDD (somente números)</label>
          <input type="text" id="cfgWhatsapp" value="51999999999" />
        </div>
      </div>

      <div class="inline-grid">
        <div class="field">
          <label for="cfgWeekday">Valor base Seg a Qui (R$)</label>
          <input type="number" id="cfgWeekday" min="0" step="50" value="2200" />
        </div>
        <div class="field">
          <label for="cfgWeekend">Valor base Sex a Dom (R$)</label>
          <input type="number" id="cfgWeekend" min="0" step="50" value="3400" />
        </div>
      </div>

      <div class="inline-grid">
        <div class="field">
          <label for="cfgMaxGuests">Capacidade máxima de convidados</label>
          <input type="number" id="cfgMaxGuests" min="10" max="2000" step="5" value="150" />
        </div>
        <div class="field">
          <label for="cfgExtraGuest">Valor por convidado extra (acima de 50)</label>
          <input type="number" id="cfgExtraGuest" min="0" step="5" value="45" />
        </div>
      </div>

      <div class="inline-grid">
        <div class="field">
          <label for="cfgAddon1Name">Adicional 1 — Nome</label>
          <input type="text" id="cfgAddon1Name" value="Som e Iluminação" />
        </div>
        <div class="field">
          <label for="cfgAddon1Price">Adicional 1 — Valor (R$)</label>
          <input type="number" id="cfgAddon1Price" min="0" step="50" value="650" />
        </div>
      </div>

      <div class="inline-grid">
        <div class="field">
          <label for="cfgAddon2Name">Adicional 2 — Nome</label>
          <input type="text" id="cfgAddon2Name" value="Churrasqueira / Equipe" />
        </div>
        <div class="field">
          <label for="cfgAddon2Price">Adicional 2 — Valor (R$)</label>
          <input type="number" id="cfgAddon2Price" min="0" step="50" value="900" />
        </div>
      </div>

      <div class="inline-grid">
        <div class="field">
          <label for="cfgAddon3Name">Adicional 3 — Nome</label>
          <input type="text" id="cfgAddon3Name" value="Decoração Básica" />
        </div>
        <div class="field">
          <label for="cfgAddon3Price">Adicional 3 — Valor (R$)</label>
          <input type="number" id="cfgAddon3Price" min="0" step="50" value="500" />
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <button type="button" class="btn btn-primary" id="generateLinkBtn">Gerar meu link pronto</button>
        <button type="button" class="btn btn-outline" id="copyLinkBtn">Copiar link</button>
      </div>

      <input type="text" class="link-output" id="generatedLinkOutput" readonly placeholder="Seu link personalizado aparecerá aqui..." />
      <div class="status-msg" id="configStatusMsg"></div>
    </section>

    <!-- Simulador usado por quem vai fazer a festa -->
    <main class="panel sim-grid">
      <div>
        <div class="inline-grid">
          <div class="field">
            <label for="eventType">Tipo de festa / evento</label>
