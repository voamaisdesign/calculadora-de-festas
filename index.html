<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Festas — Orçamentos para Salões, Buffets e Espaços de Eventos</title>
  <style>
    :root {
      --bg: #e8ecf2;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --surface-dark: #0f172a;
      --text: #0f172a;
      --text-secondary: #334155;
      --border: #94a3b8;
      --border-light: #cbd5e1;
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --cta: #d97706;
      --cta-hover: #b45309;
      --badge-bg: #dbeafe;
      --badge-text: #1e3a8a;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    header {
      background: var(--surface-dark);
      color: #ffffff;
      border-bottom: 2px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      gap: 16px;
    }

    .brand-slot {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      background: #1e293b;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 0.94rem;
    }

    .nav-links a {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #fbbf24;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.96rem;
      text-decoration: none;
      border: 2px solid transparent;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease;
    }

    .btn-cta {
      background: var(--cta);
      color: #ffffff;
    }

    .btn-cta:hover {
      background: var(--cta-hover);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--badge-bg);
    }

    /* Hero */
    .hero {
      padding: 52px 0 44px;
      background: linear-gradient(180deg, #dde3ee 0%, #e8ecf2 100%);
      border-bottom: 1px solid var(--border-light);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 28px;
      align-items: center;
    }

    .pill {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.84rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(2.1rem, 4.4vw, 3.25rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .hero-tagline {
      font-size: clamp(1.2rem, 2.2vw, 1.55rem);
      line-height: 1.3;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      max-width: 52ch;
    }

    .hero p.lead {
      font-size: 1.06rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
      max-width: 60ch;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .micro-note {
      font-size: 0.86rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .client-logo-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .client-logo-card .label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      margin-bottom: 12px;
      display: block;
    }

    .logo-preview-box {
      min-height: 116px;
      border: 2px dashed var(--primary);
      border-radius: 10px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }

    .client-logo-card small {
      display: block;
      color: var(--text-secondary);
      font-size: 0.84rem;
    }

    /* Sections */
    section {
      padding: 48px 0;
    }

    .section-header {
      max-width: 720px;
      margin-bottom: 28px;
    }

    .section-header h2 {
      font-size: clamp(1.5rem, 2.6vw, 2.05rem);
      line-height: 1.22;
      color: var(--text);
      margin-bottom: 10px;
    }

    .section-header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Dor vs Solucao */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: var(--text);
    }

    .card ul {
      list-style: none;
      display: grid;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 0.96rem;
    }

    .card ul li strong {
      color: var(--text);
    }

    .card-pain {
      border-top: 5px solid #b91c1c;
    }

    .card-gain {
      border-top: 5px solid var(--primary);
    }

    /* Demo Interativa */
    .demo-box {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    .config-banner {
      background: var(--badge-bg);
      border: 1px solid #93c5fd;
      color: var(--primary-hover);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-weight: 700;
